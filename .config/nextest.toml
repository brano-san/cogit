# Test runner configuration. How and when the suite runs: doc/09-testing.md §9.
#
# `cargo test` runs one test binary at a time; this workspace has eighty of them and most
# of the time goes on spawning `git`, not on computing. nextest runs every test from every
# binary in one pool, which turns 165 s into about 15 s on this machine.

[profile.default]
# Not the width of the CPU. Each test spawns `git` processes of its own, so a pool that
# wide turns into hundreds of processes and the desktop stops responding (R-57).
test-threads = 12
# The fixtures create temporary repositories and spawn git; a hung process must not hang
# the run.
slow-timeout = { period = "30s", terminate-after = 4 }
failure-output = "immediate-final"
fail-fast = false

# Tests that assert a duration cannot share the machine with thirty others: the number they
# measure stops being about the code. They run one at a time. No hook runs any test.
[test-groups]
timing = { max-threads = 1 }

[[profile.default.overrides]]
# By file, by `budget` in the name, by what the name promises (`does_not_hang/block/stall`),
# and the undo tests that wait out the watcher's quiet window.
filter = "binary(mutation_speed) | binary(performance) | binary(selection_speed) | test(/budget/) | test(/does_not_(hang|block|stall)/) | (binary(undo) & test(/echo|watcher/))"
test-group = "timing"
threads-required = "num-cpus"

# CI: a shared runner is several times slower than a developer machine, so a test that is
# sensitive to timing can fail once under load and pass alone. CI retries twice and reports
# such a test as FLAKY (a warning annotation, see ci.yml); a test that fails all three tries
# stays red. The heavy fixture tests get a longer leash before nextest kills them.
[profile.ci]
inherits = "default"
retries = 2
slow-timeout = { period = "60s", terminate-after = 6 }

# The app_state suite through Cogit's agent (M15): every repository opens through a
# `cogit-agent` started on this machine. `cargo nextest run -p app_state --features loopback
# --profile loopback`. Left out:
# - the handle cache counters count this process's cache; the agent keeps its own;
# - a graph walk in the agent does not wait for the window between chunks: refusing a chunk
#   stops it a few chunks later, and the graph it replaces is gone once it is complete, which
#   a small repository reaches before the window reads it (doc/12-risks.md, R-899);
# - a unit test that reads the graph cache of this process directly.
[profile.loopback]
default-filter = """
not (
    (binary(handles) & test(/^(calls_on_an_open_repository_share_one_opening|a_config_changed_from_a_terminal_is_read_back|refs_moved_from_a_terminal_need_no_reopening|closing_lets_go_of_the_opened_repository)$/))
    | (binary(graph) & test(=refusing_a_chunk_stops_the_stream))
    | (binary(graph_reuse) & test(/^(the_graph_being_replaced_is_still_read_while_the_new_one_is_walked|a_walk_replaced_before_it_ended_is_still_read_while_the_next_one_is_walked)$/))
    | (kind(lib) & test(=graph_cache::tests::a_window_waiting_for_texts_holds_no_copy_of_the_graph))
)
"""
