[package]
name = "app_state"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Open repositories, the event bus, credentials and the undo journal."

[features]
loopback = []

[[bin]]
name = "cogit-agent"
path = "src/bin/cogit_agent.rs"

[dependencies]
agent.workspace = true
portable.workspace = true
avatars.workspace = true
git_engine.workspace = true
diff_engine.workspace = true
graph_engine.workspace = true
fs_watcher.workspace = true
tokio = { workspace = true, features = ["sync"] }
parking_lot.workspace = true
keyring.workspace = true
chacha20poly1305.workspace = true
argon2.workspace = true
getrandom.workspace = true
zeroize.workspace = true
thiserror.workspace = true
chrono.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
encoding_rs.workspace = true
specta.workspace = true
specta-typescript.workspace = true
sysinfo.workspace = true

[target.'cfg(windows)'.dependencies]
windows-registry.workspace = true

[dev-dependencies]
test_fixtures.workspace = true
tempfile.workspace = true

[target.'cfg(target_env = "musl")'.dependencies]
mimalloc.workspace = true

# Its own main: git starts the test binary as Cogit's credential helper.
[[test]]
name = "sign_in"
harness = false

[lints]
workspace = true
