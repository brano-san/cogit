id = "commit-message"
name = "Conventional Commits"
hook = "commit-msg"
description = "Rejects a subject that does not follow type(scope): summary, and one over 72 characters."
config_files = []
slow = false

script = '''
#!/bin/sh
# Generated by Cogit. No external tool needed.
set -eu

subject=$(head -n 1 "$1")
case "$subject" in
  ""|"#"*) exit 0 ;;
esac

if ! echo "$subject" | grep -Eq '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9._-]+\))?!?: .+'; then
  echo "cogit: the subject must look like 'type(scope): summary'." >&2
  echo "cogit: types are feat fix docs style refactor perf test build ci chore revert." >&2
  echo "cogit: got: $subject" >&2
  exit 1
fi

if [ "${#subject}" -gt 72 ]; then
  echo "cogit: the subject is ${#subject} characters; keep it under 72." >&2
  exit 1
fi
'''
