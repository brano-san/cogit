id = "rust-fmt"
name = "Rust: cargo fmt"
hook = "pre-commit"
description = "Formats the staged Rust files and refuses to touch a partially staged one."
config_files = ["rustfmt.toml", ".rustfmt.toml"]
slow = false

script = '''
#!/bin/sh
# Generated by Cogit. Staged Rust files only; never `git add -A`.
set -eu

cargo=$(command -v cargo || true)
for candidate in "${CARGO_HOME:-}/bin/cargo" "$HOME/.cargo/bin/cargo"; do
  [ -n "$cargo" ] && break
  [ -x "$candidate" ] && cargo=$candidate
done
if [ -z "$cargo" ]; then
  echo "cogit: cargo not found. Looked in PATH, \$CARGO_HOME/bin and ~/.cargo/bin." >&2
  echo "cogit: install Rust from https://rustup.rs, then reopen Cogit." >&2
  exit 1
fi

staged=$(git diff --cached --name-only --diff-filter=ACM -- '*.rs')
[ -z "$staged" ] && exit 0

# A file staged only in part would have hunks the author left out dragged in by a rewrite.
partial=$(git diff --name-only -- $staged)
if [ -n "$partial" ]; then
  echo "cogit: these files are staged only in part, so formatting would change the commit:" >&2
  echo "$partial" >&2
  echo "cogit: stage them fully or format them by hand." >&2
  exit 1
fi

echo "$staged" | xargs "$cargo" fmt --
git add -- $staged
'''

[tool]
command = "cargo"
install_hint = "Install Rust from https://rustup.rs, then reopen Cogit so it inherits the new PATH."
search_paths = ["$CARGO_HOME/bin", "$HOME/.cargo/bin", "$USERPROFILE/.cargo/bin"]
