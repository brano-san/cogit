id = "secrets"
name = "Look for secrets"
hook = "pre-commit"
description = "Scans the staged diff for tokens and private keys before they reach history."
config_files = []
slow = false

script = '''
#!/bin/sh
# Generated by Cogit. Scans the staged diff, not the working tree.
set -eu

patterns='BEGIN [A-Z ]*PRIVATE KEY|ghp_[A-Za-z0-9]{36}|github_pat_[A-Za-z0-9_]{22,}|xox[baprs]-[A-Za-z0-9-]{10,}|AKIA[0-9A-Z]{16}|-----BEGIN OPENSSH PRIVATE KEY-----'

found=$(git diff --cached --diff-filter=ACM -U0 | grep -nE "^\+.*($patterns)" || true)
if [ -n "$found" ]; then
  echo "cogit: the staged changes look like they contain a secret:" >&2
  echo "$found" | cut -c1-120 >&2
  echo "cogit: remove it, or commit with 'No verify' if this is a false positive." >&2
  exit 1
fi
'''
