id = "large-files"
name = "Refuse large files"
hook = "pre-commit"
description = "Stops a commit that would add a file over the threshold, which is what fills a repository up."
config_files = []
slow = false

script = '''
#!/bin/sh
# Generated by Cogit. Staged files only.
set -eu

limit=${COGIT_MAX_FILE_KB:-2048}
over=""

for path in $(git diff --cached --name-only --diff-filter=ACM); do
  [ -f "$path" ] || continue
  size=$(git cat-file -s "$(git rev-parse ":$path")")
  kb=$((size / 1024))
  [ "$kb" -gt "$limit" ] && over="$over$path ($kb KB)
"
done

if [ -n "$over" ]; then
  echo "cogit: these files are over ${limit} KB:" >&2
  echo "$over" >&2
  echo "cogit: use Git LFS, or raise COGIT_MAX_FILE_KB if this is deliberate." >&2
  exit 1
fi
'''
