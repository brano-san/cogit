name: Set up Cogit toolchains
description: Rust (pinned by rust-toolchain.toml), Node, npm dependencies and build caches.
inputs:
  nextest:
    description: Install cargo-nextest
    default: "false"
runs:
  using: composite
  steps:
    # Same package set as scripts/wsl/setup-linux.sh: Tauri v2 prerequisites, the clang + mold
    # linker named in .cargo/config.toml, and a git new enough for the test fixtures (2.51+).
    - name: Linux system packages
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo add-apt-repository -y ppa:git-core/ppa
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends git jq \
          build-essential pkg-config clang mold patchelf \
          libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev libgtk-3-dev \
          libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev \
          libdbus-1-dev libsecret-1-dev xdg-utils

    - name: Check required tools
      shell: bash
      run: |
        for t in git jq; do
          command -v "$t" >/dev/null || { echo "::error::'$t' is missing on this runner"; exit 1; }
        done
        test -f rust-toolchain.toml || { echo "::error::rust-toolchain.toml not found: wrong checkout?"; exit 1; }

    # Reads rust-toolchain.toml and caches ~/.cargo and target/ (Swatinem/rust-cache inside).
    # build-warnings is emptied: the action defaults to CARGO_BUILD_WARNINGS=deny, clippy already
    # enforces it, and a warning only in a release/`portable` build must not fail the installers.
    - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
      with:
        build-warnings: ""
        # Bump to drop a poisoned cache: a restored target/ whose rlibs were pruned makes clippy
        # report "can't find crate" for crates cargo thinks are fresh.
        cache-key: v2

    - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
      if: inputs.nextest == 'true'
      with:
        tool: cargo-nextest

    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24
        cache: npm
        cache-dependency-path: package-lock.json

    - name: Install npm dependencies
      shell: bash
      run: npm ci
