name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)build, e.g. v1.2.3
        required: true

env:
  # Single switch: "true" keeps a new release a draft. Release notes are written by hand in the
  # draft (nothing is generated), so leave this on, or the release goes out with an empty body.
  RELEASE_DRAFT: "true"
  # .cargo/config.toml points at sccache, which CI runners do not have; rust-cache covers it.
  RUSTC_WRAPPER: ""

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  meta:
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.m.outputs.tag }}
      version: ${{ steps.m.outputs.version }}
      prerelease: ${{ steps.m.outputs.prerelease }}
      bundles_windows: ${{ steps.m.outputs.bundles_windows }}
    steps:
      - id: m
        shell: bash
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$tag' is not a release tag (v1.2.3, v1.2.3-rc.1)"; exit 1
          fi
          version="${tag#v}"
          pre=false; bundles=msi,nsis
          if [[ "$version" == *-* ]]; then
            pre=true
            # WiX accepts only a numeric pre-release label (<= 65535): -beta.1 cannot go into an MSI.
            [[ "${version#*-}" =~ ^[0-9]+$ ]] || bundles=nsis
          fi
          {
            echo "tag=$tag"; echo "version=$version"
            echo "prerelease=$pre"; echo "bundles_windows=$bundles"
          } >> "$GITHUB_OUTPUT"

  # Same job as in ci.yml (needs cannot cross workflows): no release with a known advisory.
  deny:
    needs: meta
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.meta.outputs.tag }}
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check

  build:
    name: Build (${{ matrix.name }})
    needs: [meta, deny]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    # A job marked experimental may fail without blocking the release: its files are simply
    # missing from it. Flip it to false after the first green run of that platform.
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            arch: x64
            experimental: false
          - name: linux-x64
            os: ubuntu-22.04   # oldest supported: a build links to the glibc of its runner (24.04 = 2.39 breaks 22.04)
            arch: amd64
            experimental: false
          # Apple Silicon only, unsigned and not notarized: Gatekeeper asks for a manual open.
          - name: macos-arm64
            os: macos-latest
            arch: aarch64
            experimental: true
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      ARCH: ${{ matrix.arch }}
      BUNDLES: ${{ matrix.name == 'windows-x64' && needs.meta.outputs.bundles_windows || matrix.name == 'macos-arm64' && 'dmg' || 'deb,appimage' }}
      # linuxdeploy (AppImage): no FUSE on the runner, and strip chokes on newer ELF sections.
      APPIMAGE_EXTRACT_AND_RUN: "1"
      NO_STRIP: "true"
      # Optional secrets: with them empty the build is unsigned. Only whether they exist is here;
      # the values go to the steps that sign, so npm scripts and build.rs never see them.
      HAS_WINDOWS_CERT: ${{ secrets.WINDOWS_CERT_BASE64 != '' }}
      # macOS builds no updater artifacts, so it gets no key.
      HAS_UPDATER_KEY: ${{ secrets.TAURI_UPDATER_KEY != '' && matrix.name != 'macos-arm64' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.meta.outputs.tag }}

      - uses: ./.github/actions/setup

      - name: Tag and manifests agree
        shell: bash
        run: node scripts/ci/check-version.mjs "$VERSION"

      # A rerun without the certificate would replace a signed installer with an unsigned one.
      # (A draft release is invisible to the read-only token: the guard then has nothing to see.)
      - name: Keep a signed release signed
        if: runner.os == 'Windows' && env.HAS_WINDOWS_CERT != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.meta.outputs.tag }}
        run: |
          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -ne 0) { exit 0 }
          $old = Join-Path $env:RUNNER_TEMP 'old-release'
          gh release download $env:TAG -p '*-setup.exe' -D $old
          $exe = Get-ChildItem $old -Filter '*-setup.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($exe -and (Get-AuthenticodeSignature $exe.FullName).Status -eq 'Valid') {
            throw "Release $env:TAG has a signed installer and WINDOWS_CERT_BASE64 is missing: restore it and rerun."
          }

      - name: Import the code-signing certificate
        if: runner.os == 'Windows' && env.HAS_WINDOWS_CERT == 'true'
        shell: pwsh
        env:
          WINDOWS_CERT_BASE64: ${{ secrets.WINDOWS_CERT_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'cogit.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERT_BASE64))
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My `
            -Password (ConvertTo-SecureString $env:WINDOWS_CERT_PASSWORD -AsPlainText -Force)
          Remove-Item $pfx -Force
          "CERT_THUMBPRINT=$($cert.Thumbprint)" >> $env:GITHUB_ENV

      - name: Write the build configs
        shell: bash
        run: |
          updater=false
          [ "$HAS_UPDATER_KEY" = true ] && updater=true
          [ "$updater" = true ] || echo "::notice::No TAURI_UPDATER_KEY: updater signatures are skipped"
          [ -n "${CERT_THUMBPRINT:-}" ] || [ "$RUNNER_OS" != Windows ] || echo "::notice::No WINDOWS_CERT_BASE64: Windows files are unsigned"
          # Full config for the installers/packages; the plain one for the portable exe (no bundler runs).
          jq -n --argjson upd "$updater" --arg thumb "${CERT_THUMBPRINT:-}" '
            {bundle: ({createUpdaterArtifacts: $upd} + (if $thumb == "" then {} else
              {windows: {certificateThumbprint: $thumb, digestAlgorithm: "sha256",
                         timestampUrl: "http://timestamp.digicert.com"}} end))}' > "$RUNNER_TEMP/release.conf.json"
          echo '{"bundle":{"createUpdaterArtifacts":false}}' > "$RUNNER_TEMP/plain.conf.json"
          native() { cygpath -m "$1" 2>/dev/null || echo "$1"; }
          {
            echo "RELEASE_CONF=$(native "$RUNNER_TEMP/release.conf.json")"
            echo "PLAIN_CONF=$(native "$RUNNER_TEMP/plain.conf.json")"
          } >> "$GITHUB_ENV"

      # The portable exe is built first, without the bundler and with the `portable` feature: the
      # binary itself knows it is portable (data in Cogit-data beside it, no updater), so the zip
      # needs no marker file. The bundler patches its bundle type (nsis/msi) into
      # target/release/cogit.exe, so the installers are built after it, without the feature.
      - name: Build the portable executable (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          npm run tauri build -- --ci --no-bundle --features portable --config "$PLAIN_CONF"
          mkdir -p portable/Cogit
          cp target/release/cogit.exe portable/Cogit/cogit.exe
          cp LICENSE portable/Cogit/LICENSE

      - name: Sign and zip the portable executable (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = 'portable\Cogit\cogit.exe'
          if ($env:CERT_THUMBPRINT) {
            $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
              Sort-Object FullName -Descending | Select-Object -First 1
            & $signtool.FullName sign /sha1 $env:CERT_THUMBPRINT /fd sha256 /tr http://timestamp.digicert.com /td sha256 $exe
            if ($LASTEXITCODE -ne 0) { throw "signtool failed with $LASTEXITCODE" }
          }
          Set-Content -Path 'portable\Cogit\README.txt' -Encoding utf8 -Value @(
            'Cogit portable: run cogit.exe, nothing is installed.',
            'It needs the Microsoft Edge WebView2 Runtime (preinstalled on Windows 11).',
            'Settings, logs and the webview profile are kept in the Cogit-data folder created',
            'next to cogit.exe; nothing is written to %APPDATA% or %LOCALAPPDATA%.',
            'Keep the folder somewhere writable. To update, replace cogit.exe with the new one;',
            'the portable version does not update itself.',
            'Git credentials entered over HTTP are stored in Windows Credential Manager.')
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path 'portable\Cogit' -DestinationPath "dist\Cogit_$($env:VERSION)_$($env:ARCH)_portable.zip" -Force

      - name: Build installers and packages
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ matrix.name != 'macos-arm64' && secrets.TAURI_UPDATER_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ matrix.name != 'macos-arm64' && secrets.TAURI_UPDATER_KEY_PASSWORD || '' }}
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            npm run tauri build -- --ci --bundles "$BUNDLES" --config "$RELEASE_CONF"
          elif [ "$RUNNER_OS" = macOS ]; then
            # No in-app updates on macOS yet: the plain config has no updater artifacts.
            npm run tauri build -- --ci --bundles dmg --config "$PLAIN_CONF"
          else
            npm run tauri build -- --ci --bundles deb --config "$RELEASE_CONF"
            # The bundler signs no deb (only app, appimage, msi, nsis), but the updater installs it:
            # sign it here, the key comes from TAURI_SIGNING_PRIVATE_KEY.
            if [ -n "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
              for deb in target/release/bundle/deb/*.deb; do
                npx tauri signer sign --password "${TAURI_SIGNING_PRIVATE_KEY_PASSWORD:-}" "$deb"
              done
            fi
          fi

      # The AppImage is the portable Linux build, so it is a second build of the same code with
      # the `portable` feature (data in Cogit-data next to the .AppImage; no in-app updater, hence
      # no updater signature). The deb above stays a normal install.
      - name: Build the portable AppImage (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: npm run tauri build -- --ci --bundles appimage --features portable --config "$PLAIN_CONF"

      - name: Collect and rename
        shell: bash
        run: |
          mkdir -p dist
          collect() {  # bundle kind, extension, final name
            [[ "$BUNDLES" == *"$1"* ]] || return 0
            src=$(ls target/release/bundle/"$1"/*."$2" 2>/dev/null | head -n1 || true)
            [ -n "$src" ] || { echo "::error::no .$2 produced in target/release/bundle/$1"; exit 1; }
            cp "$src" "dist/$3"
            if [ -f "$src.sig" ]; then cp "$src.sig" "dist/$3.sig"; fi
          }
          if [ "$RUNNER_OS" = Windows ]; then
            collect msi msi "Cogit_${VERSION}_${ARCH}.msi"
            collect nsis exe "Cogit_${VERSION}_${ARCH}-setup.exe"
          elif [ "$RUNNER_OS" = macOS ]; then
            collect dmg dmg "Cogit_${VERSION}_${ARCH}.dmg"
          else
            collect deb deb "Cogit_${VERSION}_${ARCH}.deb"
            # The AppImage is the portable Linux build (feature `portable`): one file, no installation.
            collect appimage AppImage "Cogit_${VERSION}_${ARCH}.AppImage"
            chmod +x "dist/Cogit_${VERSION}_${ARCH}.AppImage"
          fi
          ls -l dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installers-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [meta, build]
    # Not ubuntu-latest: the manifest script runs on the image's own node, and the image moves.
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.meta.outputs.tag }}
      VERSION: ${{ needs.meta.outputs.version }}
      PRERELEASE: ${{ needs.meta.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.meta.outputs.tag }}
          sparse-checkout: scripts/ci

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: installers-*
          merge-multiple: true
          path: dist

      - name: Updater manifest and checksums
        shell: bash
        working-directory: dist
        run: |
          # latest.json is what the app's updater endpoint reads (one key per installer, see the script).
          node ../scripts/ci/updater-manifest.mjs . "$VERSION" "https://github.com/$GH_REPO/releases/download/$TAG"
          sha256sum -- * > ../SHA256SUMS.txt
          mv ../SHA256SUMS.txt .
          cat SHA256SUMS.txt

      - name: Create or update the release
        shell: bash
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists: keeping its notes and state, replacing assets"
            # Upload only adds and replaces: a signature or latest.json this run did not rebuild
            # (the updater key is gone) would stay beside the new installer and fail its check.
            gh release view "$TAG" --json assets -q '.assets[].name' | node scripts/ci/updater-manifest.mjs stale dist
          else
            # No generated notes on purpose: the body stays empty until it is written by hand.
            flags=(--verify-tag --title "Cogit $VERSION" --notes "")
            [ "$PRERELEASE" = true ] && flags+=(--prerelease)
            [ "$RELEASE_DRAFT" = true ] && flags+=(--draft)
            gh release create "$TAG" "${flags[@]}"
          fi
          gh release upload "$TAG" dist/* --clobber
