name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

env:
  # .cargo/config.toml points at sccache, which CI runners do not have; rust-cache covers it.
  RUSTC_WRAPPER: ""

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            bundles: msi,nsis
          - name: linux-x64
            os: ubuntu-22.04   # oldest supported: a build links to the glibc of its runner (24.04 = 2.39 breaks 22.04)
            bundles: deb
          # Add macOS here with its bundle list, see doc/RELEASING.md.
          # - name: macos-arm64
          #   os: macos-latest
          #   bundles: dmg
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup
        with:
          nextest: "true"

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Type-check the frontend
        run: npm --prefix frontend run check

      - name: No color literals outside the theme files
        run: npm --prefix frontend run check:colors

      # A failure is also printed as ONE annotation with every failed test and its panic
      # message: the job log needs admin rights to download, the annotations of a public
      # repository do not, and a step shows only 10 of them.
      - name: Rust tests
        shell: bash
        run: |
          set +e
          cargo nextest run --workspace --exclude cogit --no-fail-fast 2>&1 | tee nextest.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            bash .github/scripts/annotate-failures.sh nextest.log "Rust test failures"
            exit "$status"
          fi
          cargo test -p cogit --lib 2>&1 | tee cogit-lib.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            bash .github/scripts/annotate-failures.sh cogit-lib.log "cogit lib test failures"
            exit "$status"
          fi

      - name: Frontend tests
        run: npm --prefix frontend run test -- --reporter=default --reporter=github-actions

      - name: Build installers
        shell: bash
        run: |
          # No updater key on PRs, so no updater artifacts.
          conf="$RUNNER_TEMP/ci.conf.json"
          echo '{"bundle":{"createUpdaterArtifacts":false}}' > "$conf"
          npm run tauri build -- --ci --bundles "${{ matrix.bundles }}" --config "$(cygpath -m "$conf" 2>/dev/null || echo "$conf")"

      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.name }}
          path: |
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
            target/release/bundle/deb/*.deb
          if-no-files-found: error
          retention-days: 3
