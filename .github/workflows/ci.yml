name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

env:
  # .cargo/config.toml points at sccache, which CI runners do not have; rust-cache covers it.
  RUSTC_WRAPPER: ""

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            bundles: msi,nsis
          # Add Linux/macOS here together with their bundle list, see doc/RELEASING.md.
          # - name: linux-x64
          #   os: ubuntu-22.04
          #   bundles: deb,appimage
          #   (needs libwebkit2gtk-4.1-dev and friends: an apt step in .github/actions/setup)
          # - name: macos-arm64
          #   os: macos-latest
          #   bundles: dmg
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup
        with:
          nextest: "true"

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Type-check the frontend
        run: npm --prefix frontend run check

      - name: No color literals outside the theme files
        run: npm --prefix frontend run check:colors

      - name: Rust tests
        run: |
          cargo nextest run --workspace --exclude cogit
          cargo test -p cogit --lib

      - name: Frontend tests
        run: npm --prefix frontend run test

      - name: Build installers
        shell: bash
        run: |
          # No updater key on PRs, so no updater artifacts.
          conf="$RUNNER_TEMP/ci.conf.json"
          echo '{"bundle":{"createUpdaterArtifacts":false}}' > "$conf"
          npm run tauri build -- --ci --bundles "${{ matrix.bundles }}" --config "$(cygpath -m "$conf" 2>/dev/null || echo "$conf")"

      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.name }}
          path: |
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 3
