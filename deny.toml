# cargo-deny configuration. Run `cargo deny check` before adding any dependency.
# See doc/02-tech-stack.md section 11.

[graph]
targets = [
  "x86_64-pc-windows-msvc",
  "x86_64-unknown-linux-gnu",
  "aarch64-apple-darwin",
]

[advisories]
yanked = "deny"
# Security vulnerabilities always fail, for the whole tree.
#
# "Unmaintained" notices only fail for our own direct dependencies. The Tauri and gix
# trees carry several (paste, proc-macro-error, the unic-* family) that we cannot act on
# — treating them as errors would mean permanently ignoring the check, which is worse
# than scoping it to what we can actually fix.
unmaintained = "workspace"
ignore = []

[licenses]
# Copyleft licences are rejected: Cogit ships as a binary under MIT.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "MPL-2.0",
  "CC0-1.0",
  "Unlicense",
  "BSL-1.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
