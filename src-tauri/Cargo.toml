[package]
name = "cogit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Cogit desktop application shell. IPC routing and windowing only (INV-09)."
# With the export-bindings helper present, plain `cargo run` would be ambiguous —
# and that is exactly what `tauri dev` invokes.
default-run = "cogit"

[lib]
# Named separately from the binary so both targets can coexist.
name = "cogit_lib"

[build-dependencies]
tauri-build.workspace = true

[dependencies]
app_state.workspace = true
diff_engine.workspace = true
fs_watcher.workspace = true
git_engine.workspace = true
graph_engine.workspace = true

tauri.workspace = true
tauri-specta.workspace = true
tauri-plugin-opener.workspace = true
tauri-plugin-dialog.workspace = true
tauri-plugin-store.workspace = true
tauri-plugin-clipboard-manager.workspace = true
tauri-plugin-window-state.workspace = true

specta.workspace = true
specta-typescript.workspace = true

anyhow.workspace = true
file-rotate.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true
